[project]
name = "eval-builder"
version = "0.1.3"
description = "Turn real LLM app logs into an eval suite and measure which LLM judges you can trust."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abel Yagubyan" }]
requires-python = ">=3.11"
keywords = ["llm", "evals", "llm-as-a-judge", "mcp", "promptfoo", "deepeval", "inspect-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "scipy>=1.10",
]

[project.scripts]
eval-builder = "eval_builder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_builder"]

[tool.hatch.build.targets.wheel.force-include]
"skills/eval-builder/SKILL.md" = "eval_builder/data/SKILL.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the HTML/CSS/JS template of the labeling sheet is one long string
"src/eval_builder/label_sheet.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
