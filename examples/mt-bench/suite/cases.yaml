  input: Does there exist an implementation with better time complexity?
  context:
  - role: user
    content: Implement a function to find the median of two sorted arrays of different sizes with O(1)
      space complexity and O(n) time complexity.
  - role: assistant
    content: |-
      ```
      def median(arr1, arr2):
          if len(arr1) > len(arr2):
              arr1, arr2 = arr2, arr1
          low = 0
          high = len(arr1) - 1

          while low < high:
              if arr1[low] > arr2[high]:
                  arr1, arr2 = arr2, arr1
                  low, high = low + 1, high - 1
              elif arr1[low] == arr2[high]:
                  low += 1
                  high -= 1

          return arr1[low]
      ```
  observed_output: Yes, there exists an implementation with better time complexity. The time complexity
    of the above function is O(n) which can be improved to O(log(n)) by using the quick sort algorithm.
    The quick sort algorithm can be used to sort the two arrays in-place and then find the median using
    the partitioning algorithm.
