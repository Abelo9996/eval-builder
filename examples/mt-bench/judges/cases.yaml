  compare_output: 'Exothermic reactions are chemical reactions that release heat or energy to the surroundings,
    while endothermic reactions absorb heat or energy from the surroundings.


    The main criteria used to distinguish between exothermic and endothermic reactions are the change
    in the system''s internal energy (ΔH) and the sign of the enthalpy change (ΔH).


    For exothermic reactions, the ΔH is negative, meaning that the reaction releases energy in the form
    of heat. This occurs when the products of the reaction have a lower enthalpy than the reactants. The
    energy released during the reaction is transferred to the surroundings, causing an increase in the
    system''s temperature.


    For endothermic reactions, the ΔH is positive, meaning that the reaction absorbs energy in the form
    of heat. This occurs when the products of the reaction have a higher enthalpy than the reactants.
    The energy required during the reaction is taken from the surroundings, causing a decrease in the
    system''s temperature.


    A real-world example of an exothermic reaction is the combustion of hydrocarbons, such as gasoline
    or natural gas, which releases energy in the form of heat and light. The chemical reaction between
    the hydrocarbons and oxygen in the air produces water vapor and carbon dioxide, along with a significant
    amount of heat.


    A real-world example of an endothermic reaction is the process of melting ice, which absorbs heat
    from the surroundings. The solid state of water has a lower enthalpy than the liquid state, so the
    energy required to change the water from a solid to a liquid is absorbed from the surroundings, causing
    a decrease in the system''s temperature.


    In summary, exothermic reactions release heat, while endothermic reactions absorb heat. The difference
    between the two types of reactions is determined by the change in the system''s internal energy and
    the sign of the enthalpy change.'
