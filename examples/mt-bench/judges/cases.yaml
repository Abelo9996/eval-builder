    \ depends on the radius of orbit and speed of the satellite. Since the speed decreases, to conserve\
    \ the angular momentum, the radius must decrease.\n\n2. The period of revolution will increase. The\
    \ period of revolution depends on the radius of the orbit and the gravitational force acting on the\
    \ satellite. As the radius decreases, the gravitational force increases. However, the increase in\
    \ gravitational force is not enough to compensate for the decrease in radius. Hence, the period increases.\
    \ \n\nIn equation form:\n\nAngular momentum = mvr = constant (where m is mass, v is speed, r is radius)\n\
    \nAs v decreases, r must also decrease to keep angular momentum constant.\n\nPeriod = 2πr/v (where\
    \ r is radius and v is speed)\n\nAs r decreases and v decreases, the period will increase.\n\nSo in\
    \ summary, according to the conservation of angular momentum and the dependence of period on radius\
    \ and speed, when the speed of the satellite decreases, its orbital radius will decrease but its period\
    \ of revolution will increase."
