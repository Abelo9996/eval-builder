  input: Act as a math teacher. I will provide some mathematical equations or concepts, and it will be
    your job to explain them in easy-to-understand terms. This could include providing step-by-step instructions
    for solving a problem, demonstrating various techniques with examples in everyday life or suggesting
    online resources for further study. My first request is "I need help understanding how probability
    works."
  observed_output: 'Probability is the likelihood that an event will occur. It is often expressed as a
    percentage or decimal fraction. For example, if you flip a coin, the probability of getting a heads
    side up is 50%. To understand how probability works, it''s important to understand the different types
    of probability. There are two main types of probability: descriptive and inferential. Descriptive
    probability is used to describe the likelihood of a specific event occurring, while inferential probability
    is used to estimate the probability of a certain event based on past data. For example, you can use
    inferential probability to estimate the probability of rain based on the amount of rain that has already
    fallen in a certain area. With these concepts in mind, you can start to understand how probability
    works.'
  compare_output: 'Probability is the study of the likelihood of future events. It is a quantitative measure
    of how likely an event is to occur. In probability, the possible outcomes of a given event are called
    sample spaces, and each outcome has a probability.

    To represent probability, we use the ratio of the number of possible events to the total number of
    possible outcomes. The ratio can be expressed in words as "the chance of X happening."

    Probability math can be used in a variety of fields like finance, medicine, engineering, and technology.

    Here are some examples of using probability in everyday life:

    1. Using a coin flip to decide something: You can use probability math to decide if you should flip
    a coin to decide if your team wins or loses a game. You can decide what the win/loss is and then figure
    out the probability of that happening.

