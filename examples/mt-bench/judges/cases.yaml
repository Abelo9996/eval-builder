    such as frequent shoppers or high spenders.

    - Recommendation systems: A model is trained to suggest products or services to users based on their
    past behavior and preferences.


    Real-world examples of reinforcement learning include:


    - Game playing: A model is trained to play games, such as chess or Go, by learning from its wins and
    losses.

    - Robotics: A model is trained to control a robot to perform tasks, such as picking up objects or
    navigating through a maze.

    - Autonomous driving: A model is trained to make driving decisions, such as accelerating, braking,
