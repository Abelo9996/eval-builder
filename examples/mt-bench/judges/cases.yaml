    Exothermic reactions release energy in the form of heat, light, or sound. In an exothermic reaction,
    the products have less energy than the reactants, and the difference in energy is released as heat.
    Exothermic reactions are characterized by a negative change in enthalpy (ΔH), meaning that the reaction
    releases heat. Examples of exothermic reactions include combustion reactions, such as burning wood
    or gasoline, and the reaction between baking soda and vinegar.


    Endothermic reactions, on the other hand, absorb energy from their surroundings. In an endothermic
    reaction, the products have more energy than the reactants, and the difference in energy is absorbed
    from the surroundings. Endothermic reactions are characterized by a positive change in enthalpy (ΔH),
    meaning that the reaction absorbs heat. Examples of endothermic reactions include the reaction between
    baking soda and citric acid in cold packs, and the reaction between water and ammonium nitrate in
    instant cold packs.


    The criteria used to distinguish between exothermic and endothermic reactions is the change in enthalpy
    (ΔH) of the reaction. If ΔH is negative, the reaction is exothermic, and if ΔH is positive, the reaction
