  input: Describe five key principles in evaluating an argument in analytical writing.
  observed_output: "Here are five key principles in evaluating an argument in analytical writing:\n\n\
    1. Identify the argument's main conclusion and supporting evidence. Analyze whether the evidence actually\
    \ supports the conclusion. Look for logical fallacies or weak evidence. \n\n2. Evaluate the credibility\
    \ and expertise of the sources cited. Consider potential biases or limitations. Determine if contrary\
    \ evidence or alternative perspectives have been overlooked.\n\n3. Analyze the overall structure and\
    \ logic of the argument. Look for logical fallacies like circular reasoning, false dichotomies, or\
    \ strawmen. Check if the argument makes unwarranted assumptions or generalizations.\n\n4. Consider\
    \ alternative explanations or counterevidence that could weaken the argument. Discuss the implications\
    \ and significance of these alternatives. \n\n5. Evaluate the rhetoric and language used. Determine\
    \ if emotive or manipulative language is being used in place of logical reasoning. Look for vague\
    \ or ambiguous terms that require clarification. \n\nIn summary, a strong analytical evaluation will\
    \ thoroughly analyze the evidence and logic, consider alternative perspectives, examine the rhetoric,\
    \ and ultimately determine how persuasive and convincing the overall argument is. The evaluation should\
    \ be fair but critical, discussing both the strengths and weaknesses of the argument."
  compare_output: 'Sure, here are five key principles in evaluating an argument in analytical writing:


    1. Clarity: The argument should be clear and easy to understand. The writer should use clear language
    and avoid ambiguity or vagueness.


    2. Coherence: The argument should be logically consistent and coherent. The writer should ensure that
    each point flows logically from the previous one and that the overall argument makes sense.


    3. Evidence: The argument should be supported by evidence. The writer should provide evidence to support
    their claims, and the evidence should be relevant, reliable, and sufficient.


    4. Counterarguments: The writer should address counterarguments. They should anticipate objections
    to their argument and address them in a thoughtful and persuasive manner.


    5. Relevance: The argument should be relevant to the topic at hand. The writer should ensure that
    their argument is directly related to the topic and that it addresses the key issues at stake.'
