  input: What are some business etiquette norms when doing business in Japan?
  observed_output: 'Here are some important business etiquette norms to keep in mind when doing business
    in Japan:


    • Bowing is an important greeting. Bow when meeting someone for the first time. Bow at a 15 degree
    angle with your back straight and hands at your sides.


    • Business cards are essential. Have your business cards printed in both English and Japanese. Present
    your card with both hands when meeting someone. Accept others'' cards with both hands as well.


    • Dress conservatively. Wear formal business attire, especially for initial meetings. For men, wear
    a suit and tie. For women, wear a formal suit or pantsuit.


    • Be punctual. Arrive on time for meetings and social engagements. Punctuality is a sign of respect.


    • Address people properly. Use the honorific -san after someone''s family name. Only use someone''s
    first name if they invite you to do so.


    • Be polite and courteous. Politeness is highly valued. Avoid direct confrontation and criticism.
    Stay calm and courteous even if there is disagreement.


    • Dining etiquette. Wait to be seated at meals. Do not start eating until the host invites you to
    start. Do not overindulge. It is polite to leave some food on your plate. Do not pierce food with
    chopsticks. Do not pass food with chopsticks that have been in your mouth.


    • Gift giving. Gifts are usually exchanged during initial meetings and to show appreciation. Choose
    high quality gifts that are wrapped nicely. Do not give gifts that are too personal. Giving gifts
    in odd numbers is considered lucky.


    • Avoid physical contact. Do not hug, backslap or touch others unnecessarily. Physical contact is
    usually avoided in business settings.


    • Be discreet. Avoid controversial topics like politics or religion. Do not brag or boast. Remain
    humble and speak in a soft, gentle tone.'
  compare_output: 'When doing business in Japan, it is important to respect the business etiquette norms.
    Some of these norms include: respecting the hierarchy, avoiding direct eye contact, using formal titles
    and last names, avoiding physical contact, being punctual, and avoiding criticism. It is also important
    to be aware of the different business cultures and to be mindful of the nonverbal cues.'
