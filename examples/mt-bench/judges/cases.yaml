  input: Describe a vivid and unique character, using strong imagery and creative language. Please answer
    in fewer than two paragraphs.
  observed_output: 'Beneath a mane of untamed, fiery curls, her emerald eyes danced with mischief and
    curiosity, as if she held secrets that could unleash worlds unknown. Her skin was kissed by a thousand
    suns, bearing the warmth of her wandering spirit as she traversed desolate deserts and lush jungles.
    Adorned in an eclectic ensemble of vibrant colors and patterns, she left a trail of whispers in her
    wake, each one eager to unravel the enigma she embodied.


    Her laughter was like the chiming of silver bells, a melody that echoed through the chambers of the
    hearts she touched. With every fluid motion of her nimble fingers, she wove tales that transcended
    time and space, her words painting vivid tapestries in the minds of those who bore witness. She was
    a living paradox; as ephemeral as a wisp of smoke yet as eternal as the stars that guided her journey,
    a beacon of light that cast a mesmerizing shadow on the world around her.'
  compare_output: "Here is a vivid character description in two paragraphs:\n\nThe old lighthouse keeper\
    \ hobbled along the rocky shore, his gnarled hands grasping a crooked walking stick worn smooth by\
    \ the sea. A battered oilskin coat hung loose on his wiry frame, as pale and weathered as driftwood.\
    \ His eyes, the color of the stormy sea, gazed with a keenness that belied his years. Those eyes had\
    \ witnessed untold sunrises and storms, had guided ships through treacherous shoals, and had scanned\
    \ the horizon looking for dangers known only to him.  \n\nThough battered by the elements, he stood\
    \ unbowed. His voice rasped like sand on sandstone as he called out a greeting. When he smiled, deep\
    \ crevices lined his face, etched there by sun and wind and a lifetime of standing against the forces\
    \ of nature to ensure safe passage for those at sea. The lighthouse may have officially retired years\
    \ ago, but its keeper remained on vigil, a solitary weathered figure maintaining his faithful watch\
    \ as he had for decades. His gnarled hands and crooked stick were as much a part of the landscape\
    \ as the rocks and sea and crumbling tower, and as enduring."
