  input: Write a persuasive email to convince your introverted friend, who dislikes public speaking, to
    volunteer as a guest speaker at a local event. Use compelling arguments and address potential objections.
    Please be concise.
  observed_output: "Dear Friend,\n\nI know you're not a big fan of public speaking, but I think volunteering\
    \ as a guest speaker at a local event could be a great experience for you. As a speaker, you'll have\
    \ the chance to hone your communication skills, build confidence in speaking, and share your knowledge\
    \ with the attendees. \n\nIt might be intimidating at first, but I'm sure you can do it. You have\
    \ a lot of valuable insights to share, and you'll be surprised by how much you enjoy it. Plus, it's\
    \ only for one event, so there's no pressure to do it again if you don't want to. \n\nIf you're still\
    \ hesitant, consider this: volunteering as a speaker will help you to get comfortable with public\
    \ speaking and could even lead to more speaking opportunities in the future. That way, you can take\
    \ your time to gradually build up your confidence. \n\nLet me know if you're interested, and I'll\
    \ make sure to answer any questions you may have. \n\nBest, \n\n<Your Name>"
  compare_output: 'Hi [Friend’s Name],

    I''m writing to invite you to volunteer as a guest speaker at a local event for [Event Name]. The
    event will be held at [Location] on [Date] from [Time] to [Time].

    As you may know, [Event Name] is an annual fundraising event that raises awareness and funds for [Cause].
    It celebrates the contributions of local artists and showcases their work in an art gallery. The event
    also features a number of talks by guest speakers on various topics related to [Cause].

    I think you would be an ideal guest speaker for this event because you''re an [Occupation] and have
    a wealth of knowledge and experience in [Cause]. You have a passion for making a difference in [Cause],
    and your stories and insights would be inspiring to the audience.

    I know you''re an introvert and dislike public speaking, but I''m convinced that you would do a great
    job. I can help you prepare for the event by sharing a few tips and tricks that will make you more
    comfortable and confident on stage.

    I''m sure you''ll have a great time at the event and meet lots of interesting people.

    If you''re not free on [Date] and [Time], perhaps you could still volunteer as a guest speaker at
    another time.

    I look forward to hearing from you and hope to see you at the event.

    Chamath Palihapitiya, an investor in Facebook and Airbnb, said in a keynote at Stanford: "The probability
    that you''ll change the world is inversely proportional to how well you know what you are doing."

    In other words, the more you know about a specific topic, the less likely you are to be successful.

    Another quote from Chamath: "When you get the chance to do something, say yes."

    It’s important to say yes to new opportunities, even if they make you uncomfortable. This is especially
    true for introverts, who are often reluctant to embrace new experiences.

    It’s easy to say no because it’s safe and comfortable. But if you want to have a fulfilling life,
    you must step out of your comfort zone and try new things.

    The best way to overcome your introverted tendencies is to get out of your head and stop thinking
    about the consequences. When you’re in your head, worrying about what could go wrong, you’re not living
    in the present and enjoying the experience.

    Instead, try to focus on the here and now. Remind yourself that the experience is happening now, not
    in the future. If you can live in the present moment, you’ll find it easier to overcome your fears
    and say yes.

    In the long run, you’ll be glad you said yes to new experiences.'
