  input: 'Create a lesson plan that integrates drama, mime or theater techniques into a history class.
    Duration: 3 class periods (each lasts for 45 minutes) for 3 days

    Topic: Opium Wars between China and Britain

    Grade level: 9-10'
  observed_output: "Here is a suggested 3-day lesson plan integrating drama techniques into a history\
    \ class on the Opium Wars:\n\nDay 1 (45 mins):\n- Introduction (10 mins): Briefly introduce the historical\
    \ context of the Opium Wars between China and Britain in the 19th century. Discuss how Britain wanted\
    \ to trade opium grown in India for Chinese goods like tea, silk and porcelain. China opposed the\
    \ opium trade and this led to two wars. \n- Role play (20 mins): Ask students to role play as either\
    \ Chinese officials who want to curb opium trade or British traders who want to expand trade. Have\
    \ them debate and try to convince each other of their positions. Students can use dramatic techniques\
    \ like impassioned speeches, rhetorical questions, etc. The goal is to understand each side's perspectives.\n\
    - Debrief (15 mins): Discuss how the role play went and what students learnt about the different positions.\
    \ Ask them to share their reflections on the arguments made.\n\nDay 2 (45 mins):\n- Mime (20 mins):\
    \ Ask students to mime the key events of the First Opium War from 1839 to 1842. Some scenes could\
    \ be: Lin Zexu destroying British opium, British attacking Chinese ports, Treaty of Nanking signing.\
    \ Students can be creative in their miming.\n- Discuss (25 mins): After the mime, discuss what happened\
    \ in each scene. Ask students what they found most interesting or impactful about acting out these\
    \ historical events. Discuss how miming helped them gain a more vivid sense of the events.\n\nDay\
    \ 3 (45 mins): \n- Theater (30 mins): Have students work in groups to create a short skit to reenact\
    \ a key moment from the Second Opium War from 1856 to 1860. They can choose scenes like the Arrow\
    \ Incident, the British and French looting and burning of the Summer Palace, negotiations of the Treaty\
    \ of Tianjin, etc. Ask them to be as dramatic as possible in their skits.\n- Share and reflect (15\
    \ mins): Have each group share their skits. Discuss how drama and theater helped the students engage\
    \ with this history topic. Ask them to reflect on what they have learnt about this period in China's\
    \ history."
