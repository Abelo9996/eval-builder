# Judges checked against MT-Bench human expert verdicts. The prompt is adapted from
# the MT-Bench pairwise judge prompt (Zheng et al. 2023), shortened to a one-letter
# answer so small local models can follow it.
version: 1
criteria:
- id: overall-quality
  description: Helpfulness, relevance, accuracy, depth and level of detail, as in the MT-Bench
    pairwise setup.
  scale: pairwise
judges:
- id: qwen2.5-3b
  mode: pairwise
  criteria: [overall-quality]
  labels: [A, B]
  prompt: &prompt |
    Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below. You should choose the assistant that follows the user's instructions and answers the user's question better. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, and level of detail of their responses. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Be as objective as possible. Reply with a single letter: "A" if assistant A is better, "B" if assistant B is better.

    [User Question]
    {input}

    [The Start of Assistant A's Answer]
    {answer_a}
    [The End of Assistant A's Answer]

    [The Start of Assistant B's Answer]
    {answer_b}
    [The End of Assistant B's Answer]

    Verdict (A or B):
- {id: qwen2.5-7b, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
- {id: qwen2.5-7b-temp0, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
- {id: llama3.2-3b, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
- {id: gemma2-2b, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
- {id: control-longer-answer, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
- {id: control-coin-flip, mode: pairwise, criteria: [overall-quality], labels: [A, B], prompt: *prompt}
