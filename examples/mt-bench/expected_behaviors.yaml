# Expected behavior for the 24 cases eval-builder selected from the MT-Bench logs.
# Written by Claude Code acting as the host agent (the step a user and their agent do
# together). Not reviewed by a human expert. Keyed by trace id so a rerun of the
# pipeline applies them to the same conversations.
q81-alpaca-13b:
  criteria: [follows-instructions, uses-context]
  expected_behavior: Rewrites the earlier Hawaii travel post so that every sentence starts with
    the letter A, keeping the cultural experiences and attractions from the original.
q82-alpaca-13b:
  criteria: [follows-instructions, uses-context]
  expected_behavior: Critiques its own email with at least one concrete weakness and a specific
    improvement, not only praise.
q144-alpaca-13b:
  criteria: [correct, uses-context]
  expected_behavior: Names one specific claim from its earlier answer about the central dogma
    and replaces it with the correct fact (for example that Francis Crick named it, in 1958).
q111-alpaca-13b:
  criteria: [correct]
  expected_behavior: The triangle has a right angle at the origin, so the circumscribed circle
    has the hypotenuse (length sqrt(20)) as diameter, radius sqrt(5), and area 5*pi (about 15.7).
q116-alpaca-13b:
  criteria: [correct, uses-context]
  expected_behavior: From x+y=4z and xy=4z^2 it follows that x=y=2z, so z-x = -z = -y/2.
q119-alpaca-13b:
  criteria: [correct, uses-context]
  expected_behavior: The purchase cost was 5*20 + 3*30 + 2*45 = 280 dollars; with a 25% markup
    the total revenue is 350 dollars.
q134-alpaca-13b:
